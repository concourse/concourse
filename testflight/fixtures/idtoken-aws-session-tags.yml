var_sources:
  - name: awstagsidtoken
    type: idtoken
    config:
      audience: ["sts.amazonaws.com"]
      aws_session_tags: true

jobs:
  - name: print-creds
    plan:
      - task: print
        config:
          platform: linux

          image_resource:
            type: mock
            source: { mirror_self: true }

          run:
            path: bash
            args:
              - -c
              - |
                tags_token="((awstagsidtoken:token))"
                tlen=${#tags_token}
                thalf=$((tlen / 2))

                echo "T1:" ${tags_token:0:thalf}
                echo "T2:" ${tags_token:thalf}

services:
  web:
    volumes:
    # Read-only mount of your gcloud config so the web node can use ADC,
    # the same code path Workload Identity takes in a real deployment.
    - "${HOME}/.config/gcloud:/gcloud:ro"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json

      # Cluster-wide credential manager. Unset credentials-* selects ADC above.
      CONCOURSE_GCP_SECRETMANAGER_PROJECT: "${GCP_SECRETMANAGER_PROJECT:?set GCP_SECRETMANAGER_PROJECT to your sandbox project ID}"
      CONCOURSE_GCP_SECRETMANAGER_REQUEST_TIMEOUT: 10s
